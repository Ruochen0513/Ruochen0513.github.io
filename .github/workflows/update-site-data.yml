name: Update site data

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron uses UTC. 19:00 UTC is 03:00 Asia/Shanghai.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-site-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || github.token }}
        run: >-
          node automation/update-site-data.mjs
          --config automation/github-pages-config.json
          --env /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
